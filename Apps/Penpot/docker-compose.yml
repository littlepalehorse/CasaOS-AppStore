name: penpot

services:
  penpot-frontend:
    container_name: penpot-frontend
    image: penpotapp/frontend:2.16
    restart: unless-stopped
    volumes:
      - /DATA/AppData/$AppID/assets:/opt/data/assets
    ports:
      - "9001:8080"
    depends_on:
      - penpot-backend
      - penpot-exporter
    networks:
      - penpot-net
    environment:
      - PENPOT_FLAGS=enable-registration enable-login-with-password disable-email-verification disable-secure-session-cookies enable-smtp enable-prepl-server enable-mcp
    x-casaos:
      volumes:
        - container: /opt/data/assets
          description:
            en_US: 'Container Path: /opt/data/assets'
            ru_RU: 'Путь к файлам ассетов'
      ports:
        - container: "8080"
          description:
            en_US: 'Container Port: 8080'
            ru_RU: 'Порт веб-интерфейса'

  penpot-backend:
    image: penpotapp/backend:2.16
    container_name: penpot-backend
    restart: unless-stopped
    volumes:
      - /DATA/AppData/$AppID/assets:/opt/data/assets
    depends_on:
      - penpot-postgres
      - penpot-redis
    networks:
      - penpot-net
    environment:
      - PENPOT_FLAGS=enable-registration enable-login-with-password disable-email-verification disable-secure-session-cookies enable-smtp enable-prepl-server enable-mcp
      - PENPOT_SECRET_KEY=change-this-insecure-key
      - PENPOT_PUBLIC_URI=http://penpot-frontend:8080
      - PENPOT_DATABASE_URI=postgresql://penpot-postgres/penpot
      - PENPOT_DATABASE_USERNAME=penpot
      - PENPOT_DATABASE_PASSWORD=penpot
      - PENPOT_REDIS_URI=redis://penpot-redis/0
      - PENPOT_ASSETS_STORAGE_BACKEND=assets-fs
      - PENPOT_STORAGE_ASSETS_FS_DIRECTORY=/opt/data/assets
      - PENPOT_TELEMETRY_ENABLED=false
      - PENPOT_SMTP_DEFAULT_FROM=no-reply@example.com
      - PENPOT_SMTP_DEFAULT_REPLY_TO=no-reply@example.com
      - PENPOT_SMTP_HOST=penpot-mailcatch
      - PENPOT_SMTP_PORT=1025
      - PENPOT_SMTP_TLS=false
      - PENPOT_SMTP_SSL=false
    x-casaos:
      envs:
        - container: PENPOT_FLAGS
          description:
            en_US: 'Penpot feature flags'
            ru_RU: 'Флаги функций Penpot'
        - container: PENPOT_SECRET_KEY
          description:
            en_US: 'Secret key for encryption'
            ru_RU: 'Секретный ключ шифрования'
        - container: PENPOT_PUBLIC_URI
          description:
            en_US: 'Public URI for Penpot'
            ru_RU: 'Публичный URI Penpot'
        - container: PENPOT_DATABASE_URI
          description:
            en_US: 'Database connection URI'
            ru_RU: 'URI подключения к базе данных'
        - container: PENPOT_DATABASE_USERNAME
          description:
            en_US: 'Database username'
            ru_RU: 'Имя пользователя базы данных'
        - container: PENPOT_DATABASE_PASSWORD
          description:
            en_US: 'Database password'
            ru_RU: 'Пароль базы данных'
        - container: PENPOT_REDIS_URI
          description:
            en_US: 'Redis connection URI'
            ru_RU: 'URI подключения к Redis'
        - container: PENPOT_ASSETS_STORAGE_BACKEND
          description:
            en_US: 'Assets storage backend type'
            ru_RU: 'Тип хранилища ассетов'
        - container: PENPOT_STORAGE_ASSETS_FS_DIRECTORY
          description:
            en_US: 'Filesystem storage directory'
            ru_RU: 'Директория файлового хранилища'
        - container: PENPOT_TELEMETRY_ENABLED
          description:
            en_US: 'Enable telemetry'
            ru_RU: 'Включить телеметрию'
        - container: PENPOT_SMTP_DEFAULT_FROM
          description:
            en_US: 'Default SMTP from address'
            ru_RU: 'SMTP адрес отправителя по умолчанию'
        - container: PENPOT_SMTP_DEFAULT_REPLY_TO
          description:
            en_US: 'Default SMTP reply-to address'
            ru_RU: 'SMTP адрес ответа по умолчанию'
        - container: PENPOT_SMTP_HOST
          description:
            en_US: 'SMTP server host'
            ru_RU: 'Хост SMTP-сервера'
        - container: PENPOT_SMTP_PORT
          description:
            en_US: 'SMTP server port'
            ru_RU: 'Порт SMTP-сервера'
        - container: PENPOT_SMTP_TLS
          description:
            en_US: 'Enable TLS for SMTP'
            ru_RU: 'Включить TLS для SMTP'
        - container: PENPOT_SMTP_SSL
          description:
            en_US: 'Enable SSL for SMTP'
            ru_RU: 'Включить SSL для SMTP'
      volumes:
        - container: /opt/data/assets
          description:
            en_US: 'Container Path: /opt/data/assets'
            ru_RU: 'Путь к файлам ассетов'

  penpot-exporter:
    image: penpotapp/exporter:2.16
    container_name: penpot-exporter
    restart: unless-stopped
    networks:
      - penpot-net
    depends_on:
      - penpot-redis
    environment:
      - PENPOT_SECRET_KEY=change-this-insecure-key
      - PENPOT_PUBLIC_URI=http://penpot-frontend:8080
      - PENPOT_REDIS_URI=redis://penpot-redis/0
    x-casaos:
      envs:
        - container: PENPOT_SECRET_KEY
          description:
            en_US: 'Secret key for encryption'
            ru_RU: 'Секретный ключ шифрования'
        - container: PENPOT_PUBLIC_URI
          description:
            en_US: 'Public URI for Penpot'
            ru_RU: 'Публичный URI Penpot'
        - container: PENPOT_REDIS_URI
          description:
            en_US: 'Redis connection URI'
            ru_RU: 'URI подключения к Redis'

  penpot-mcp:
    image: penpotapp/mcp:2.16
    container_name: penpot-mcp
    networks:
      - penpot-net
    restart: unless-stopped

  penpot-postgres:
    image: postgres:14
    restart: unless-stopped
    container_name: penpot-postgres
    stop_signal: SIGINT
    volumes:
      - /DATA/AppData/$AppID/pgdata:/var/lib/postgresql/data
    networks:
      - penpot-net
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=penpot
      - POSTGRES_USER=penpot
      - POSTGRES_PASSWORD=penpot
    x-casaos:
      envs:
        - container: POSTGRES_INITDB_ARGS
          description:
            en_US: 'PostgreSQL init arguments'
            ru_RU: 'Аргументы инициализации PostgreSQL'
        - container: POSTGRES_DB
          description:
            en_US: 'Database name'
            ru_RU: 'Имя базы данных'
        - container: POSTGRES_USER
          description:
            en_US: 'Database username'
            ru_RU: 'Имя пользователя базы данных'
        - container: POSTGRES_PASSWORD
          description:
            en_US: 'Database password'
            ru_RU: 'Пароль базы данных'
      volumes:
        - container: /var/lib/postgresql/data
          description:
            en_US: 'PostgreSQL data directory'
            ru_RU: 'Директория данных PostgreSQL'

  penpot-redis:
    image: redis:7
    container_name: penpot-redis
    restart: unless-stopped
    networks:
      - penpot-net

  penpot-mailcatch:
    image: sj26/mailcatcher:latest
    restart: always
    expose:
      - "1025"
    ports:
      - "1080:1080"
    networks:
      - penpot-net
    x-casaos:
      ports:
        - container: "1080"
          description:
            en_US: 'MailCatcher web interface'
            ru_RU: 'Веб-интерфейс MailCatcher'

networks:
  penpot-net:
    driver: bridge

x-casaos:
  architectures:
    - amd64
    - arm64
  id: com.lph.penpot
  main: penpot-frontend
  author: LittlePaleHorse
  category: Developer
  description:
    en_US: |
      Penpot is the first open-source design and prototyping platform meant for cross-domain teams. Designers craft beautiful interfaces with professional vector tools, while developers inspect the code in real-time.

      **Main Features:**
      - Open-source design platform (SVG-based)
      - Real-time collaboration for designers and developers
      - Prototyping with interactions and animations
      - Design tokens and variables for consistent branding
      - Self-hosted — full data sovereignty
      - Plugin system and MCP (Model Context Protocol) support

      **Learn More:**
      - [Penpot Official Website](https://penpot.app)
      - [Penpot GitHub](https://github.com/penpot/penpot)
      - [Penpot Documentation](https://help.penpot.app)
    ru_RU: |
      Penpot — первая open-source платформа для дизайна и прототипирования, созданная для кросс-функциональных команд. Дизайнеры создают красивые интерфейсы с помощью профессиональных векторных инструментов, а разработчики в реальном времени просматривают код.

      Penpot позволяет командам совместно проектировать, создавать прототипы и разрабатывать интерфейс в одном месте. Работает в браузере, использует открытые стандарты (SVG, CSS, HTML) и запускается на собственном сервере — вы полностью контролируете свои данные.

      **Основные Функции:**
      - Open-source платформа для дизайна (на базе SVG)
      - Совместная работа в реальном времени для дизайнеров и разработчиков
      - Прототипирование с интеракциями и анимациями
      - Design tokens и переменные для согласованного брендинга
      - Self-hosted — полный контроль над данными
      - Система плагинов и поддержка MCP (Model Context Protocol)

      **Узнать Больше:**
      - [Официальный сайт Penpot](https://penpot.app)
      - [Penpot GitHub](https://github.com/penpot/penpot)
      - [Документация Penpot](https://help.penpot.app)
  developer: ULAB (Penpot)
  icon: https://cdn.jsdelivr.net/gh/littlepalehorse/CasaOS-AppStore@main/Apps/Penpot/icon.svg
  tagline:
    en_US: Open-source design and prototyping platform for cross-domain teams.
    ru_RU: Open-source платформа для дизайна и прототипирования.
  title:
    en_US: Penpot (LPH)
    ru_RU: Penpot (LPH)
  index: /
  port_map: "9001"
  scheme: http
  version: "2.16.0"
  update_at: "2025-06-07"
  release_notes:
    en_US: Initial release for CasaOS. Based on Penpot 2.16.
    ru_RU: Первичный релиз для CasaOS. На базе Penpot 2.16.
  website: "https://penpot.app"
  repo: "https://github.com/penpot/penpot"
  support: "https://github.com/penpot/penpot/issues"
  docs: "https://help.penpot.app"
  tips:
    before_install:
      en_US: |
        **Important:** After first install, change `PENPOT_SECRET_KEY` and `PENPOT_DATABASE_PASSWORD` to secure values. The default key is insecure.

        For production use, configure a real SMTP provider (the included mailcatcher is for testing only) and remove the `disable-email-verification` and `disable-secure-session-cookies` flags from `PENPOT_FLAGS`.
      ru_RU: |
        **Важно:** После первой установки измените `PENPOT_SECRET_KEY` и `PENPOT_DATABASE_PASSWORD` на безопасные значения. Значение по умолчанию небезопасно.

        Для продакшена настройте реального SMTP-провайдера (встроенный mailcatcher только для тестов) и удалите флаги `disable-email-verification` и `disable-secure-session-cookies` из `PENPOT_FLAGS`.
