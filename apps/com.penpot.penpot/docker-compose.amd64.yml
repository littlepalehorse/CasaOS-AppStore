name: penpot
networks:
  penpot: null
services:
  penpot-frontend:
    image: penpotapp/frontend:2.16@sha256:7bcd6d8ffa333054906cde55f6e9da9936a19b2ab30d2b50cb263d44e7740c7b
    container_name: penpot-frontend
    restart: unless-stopped
    ports:
    - target: 8080
      published: '9001'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/assets
      target: /opt/data/assets
    depends_on:
    - penpot-backend
    - penpot-exporter
    - penpot-mcp
    environment:
      PENPOT_FLAGS: disable-email-verification enable-smtp enable-prepl-server disable-secure-session-cookies
        enable-mcp
      PENPOT_PUBLIC_URI: http://localhost:9001
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: '367001600'
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: '367001600'
    networks:
    - penpot
  penpot-backend:
    image: penpotapp/backend:2.16@sha256:c322cb8f864dc8c23ab033883c22e8b2e11ffb03cb63bede249b21ca6d56f6b4
    container_name: penpot-backend
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/assets
      target: /opt/data/assets
    depends_on:
    - penpot-postgres
    - penpot-valkey
    environment:
      PENPOT_FLAGS: disable-email-verification enable-smtp enable-prepl-server disable-secure-session-cookies
        enable-mcp
      PENPOT_PUBLIC_URI: http://localhost:9001
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: '367001600'
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: '367001600'
      PENPOT_SECRET_KEY: change-this-insecure-key
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: penpot
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: 'true'
      PENPOT_TELEMETRY_REFERER: compose
      PENPOT_SMTP_DEFAULT_FROM: no-reply@example.com
      PENPOT_SMTP_DEFAULT_REPLY_TO: no-reply@example.com
      PENPOT_SMTP_HOST: penpot-mailcatch
      PENPOT_SMTP_PORT: '1025'
      PENPOT_SMTP_USERNAME: ''
      PENPOT_SMTP_PASSWORD: ''
      PENPOT_SMTP_TLS: 'false'
      PENPOT_SMTP_SSL: 'false'
    networks:
    - penpot
  penpot-mcp:
    image: penpotapp/mcp:2.16@sha256:11953d9807d94e05b8fd6e1863886492942c326cc47dc7ce829f695b4bdb65d8
    container_name: penpot-mcp
    restart: unless-stopped
    networks:
    - penpot
  penpot-exporter:
    image: penpotapp/exporter:2.16@sha256:7f4cc034d9366627d7c8e222a70fbbeacc88ad4ee8dd5bc2302ad83b77c2d148
    container_name: penpot-exporter
    restart: unless-stopped
    depends_on:
    - penpot-valkey
    environment:
      PENPOT_SECRET_KEY: change-this-insecure-key
      PENPOT_PUBLIC_URI: http://localhost:9001
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
    networks:
    - penpot
  penpot-postgres:
    image: postgres:15@sha256:2c64f6d1be50ea37f722d27b936abc6557e5fb95c995514bd9c43490ef8160ef
    container_name: penpot-postgres
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/postgres
      target: /var/lib/postgresql/data
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: penpot
    networks:
    - penpot
  penpot-valkey:
    image: valkey/valkey:8.1@sha256:c243b36ee422e70172dfe95bc0b602b0b6939c9caee3c4bf418044cc60ea2d3c
    container_name: penpot-valkey
    restart: unless-stopped
    environment:
      VALKEY_EXTRA_FLAGS: --maxmemory 128mb --maxmemory-policy volatile-lfu
    networks:
    - penpot
  penpot-mailcatch:
    image: sj26/mailcatcher:latest@sha256:238a915586b99dd957fed9dfc27fa36518e038b9d43368fbaf2e384968b6e36f
    container_name: penpot-mailcatch
    restart: unless-stopped
    ports:
    - target: 1025
      published: '1025'
      protocol: tcp
    - target: 1080
      published: '1080'
      protocol: tcp
    networks:
    - penpot
x-casaos:
  id: com.penpot.penpot
  main: penpot-frontend
  icon: https://cdn.jsdelivr.net/gh/littlepalehorse/CasaOS-AppStore@gh-pages/apps/com.penpot.penpot/assets/icon.svg
  title:
    en_US: Penpot
    ru_RU: Penpot
  index: /
  port_map: '9001'
  scheme: http
  version: 2.16.0
