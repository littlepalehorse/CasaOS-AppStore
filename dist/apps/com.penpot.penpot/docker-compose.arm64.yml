name: penpot
networks:
  penpot: null
services:
  penpot-frontend:
    image: penpotapp/frontend:2.16@sha256:f70dd1cf96e2929b000067b3ca125f0c4fba734a09c8ef0461cafcee58d642d2
    container_name: penpot-frontend
    restart: unless-stopped
    ports:
    - target: 8080
      published: '9001'
      protocol: tcp
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/assets
      target: /opt/data/assets
    depends_on:
    - penpot-backend
    - penpot-exporter
    - penpot-mcp
    environment:
      PENPOT_FLAGS: disable-email-verification enable-smtp enable-prepl-server disable-secure-session-cookies
        enable-mcp
      PENPOT_PUBLIC_URI: http://localhost:9001
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: '367001600'
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: '367001600'
    networks:
    - penpot
  penpot-backend:
    image: penpotapp/backend:2.16@sha256:ce02d00feb6b3341db8efeb3483ad2de64e4a2def41d2ba354a5c37bf1874a13
    container_name: penpot-backend
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/assets
      target: /opt/data/assets
    depends_on:
    - penpot-postgres
    - penpot-valkey
    environment:
      PENPOT_FLAGS: disable-email-verification enable-smtp enable-prepl-server disable-secure-session-cookies
        enable-mcp
      PENPOT_PUBLIC_URI: http://localhost:9001
      PENPOT_HTTP_SERVER_MAX_BODY_SIZE: '367001600'
      PENPOT_HTTP_SERVER_MAX_MULTIPART_BODY_SIZE: '367001600'
      PENPOT_SECRET_KEY: change-this-insecure-key
      PENPOT_DATABASE_URI: postgresql://penpot-postgres/penpot
      PENPOT_DATABASE_USERNAME: penpot
      PENPOT_DATABASE_PASSWORD: penpot
      PENPOT_REDIS_URI: redis://penpot-valkey/0
      PENPOT_OBJECTS_STORAGE_BACKEND: fs
      PENPOT_OBJECTS_STORAGE_FS_DIRECTORY: /opt/data/assets
      PENPOT_TELEMETRY_ENABLED: 'true'
      PENPOT_TELEMETRY_REFERER: compose
      PENPOT_SMTP_DEFAULT_FROM: no-reply@example.com
      PENPOT_SMTP_DEFAULT_REPLY_TO: no-reply@example.com
      PENPOT_SMTP_HOST: penpot-mailcatch
      PENPOT_SMTP_PORT: '1025'
      PENPOT_SMTP_USERNAME: ''
      PENPOT_SMTP_PASSWORD: ''
      PENPOT_SMTP_TLS: 'false'
      PENPOT_SMTP_SSL: 'false'
    networks:
    - penpot
  penpot-mcp:
    image: penpotapp/mcp:2.16@sha256:c654e6bd8b28343dd833e38cc70da0f8cb7f805363bc02beab6e2cd62bfbc8d9
    container_name: penpot-mcp
    restart: unless-stopped
    networks:
    - penpot
  penpot-exporter:
    image: penpotapp/exporter:2.16@sha256:cff9f2312e0845795ef5255eeee12afeef766be1371cd25733072eb6bb7433ae
    container_name: penpot-exporter
    restart: unless-stopped
    depends_on:
    - penpot-valkey
    environment:
      PENPOT_SECRET_KEY: change-this-insecure-key
      PENPOT_PUBLIC_URI: http://localhost:9001
      PENPOT_INTERNAL_URI: http://penpot-frontend:8080
      PENPOT_REDIS_URI: redis://penpot-valkey/0
    networks:
    - penpot
  penpot-postgres:
    image: postgres:15@sha256:5708c35fea4837dd0be5d078f3fae751062edf80bc3b5d76a57f11dcfaf86bdb
    container_name: penpot-postgres
    restart: unless-stopped
    volumes:
    - type: bind
      source: /DATA/AppData/$AppID/postgres
      target: /var/lib/postgresql/data
    environment:
      POSTGRES_INITDB_ARGS: --data-checksums
      POSTGRES_DB: penpot
      POSTGRES_USER: penpot
      POSTGRES_PASSWORD: penpot
    networks:
    - penpot
  penpot-valkey:
    image: valkey/valkey:8.1@sha256:7d348aba140d6315fc56a73b9c9c3411c84a9012543230526f5c2353af90a893
    container_name: penpot-valkey
    restart: unless-stopped
    environment:
      VALKEY_EXTRA_FLAGS: --maxmemory 128mb --maxmemory-policy volatile-lfu
    networks:
    - penpot
  penpot-mailcatch:
    image: sj26/mailcatcher:latest@sha256:3e0c592b49ed5c60b342d9b7af65aff7fb7309b7d2379c266c53e1fc12af626f
    container_name: penpot-mailcatch
    restart: unless-stopped
    ports:
    - target: 1025
      published: '1025'
      protocol: tcp
    - target: 1080
      published: '1080'
      protocol: tcp
    networks:
    - penpot
x-casaos:
  id: com.penpot.penpot
  main: penpot-frontend
  icon: https://cdn.jsdelivr.net/gh/littlepalehorse/CasaOS-AppStore@gh-pages/apps/com.penpot.penpot/assets/icon.svg
  title:
    en_US: Penpot
    ru_RU: Penpot
  index: /
  port_map: '9001'
  scheme: http
  version: 2.16.0
